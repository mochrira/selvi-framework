get:
  tags: [Grup]
  summary: Mengambil semua data grup
  security: 
    - token: [read]
  parameters:
    - in: query
      name: offset
      schema:
        type: integer
    - in: query
      name: limit
      schema:
        type: integer
  responses:
    '200':
      description: Semua data grup dalam format JSON

post:
  tags: [Grup]
  summary: Menambahkan Grup
  security: 
    - token: [read]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            nmGrup:
              type: string
          example:
            nmGrup: Sales
  responses:
    '201':
      description: Created