get:
  tags: [Kontak]
  summary: Mengambil semua data kontak
  parameters:
    - in: path
      name: metode
      schema:
        type: string
        enum: [model, service]
    - in: query
      name: idDepartemen
      schema:
        type: integer
    - in: query
      name: search
      schema:
        type: string
    - in: query
      name: order
      description: Kolom pengurutan
      schema:
        type: string
    - in: query
      name: offset
      schema:
        type: integer
    - in: query
      name: limit
      schema:
        type: integer
  responses:
    '200':
      description: Semua data kontak dalam format JSON

post:
  tags: [Kontak]
  summary: Menambahkan kontak

  parameters:
    - in: path
      name: metode
      schema:
        type: string
        enum: [model, service]

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            nmKontak:
              type: string
            idDepartemen:
              type: integer
            idUnit:
              type: integer
            idProfesi:
              type: integer
          example:
            nmKontak: John Doe
            idDepartemen: 1
            idUnit: 1
            idProfesi: 1
  responses:
    '201':
      description: Created