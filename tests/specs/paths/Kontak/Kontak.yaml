get:
  tags: [Kontak]
  summary: Mengambil semua data kontak
  parameters:
    - in: query
      name: idGrup
      schema:
        type: integer
    - in: query
      name: search
      schema:
        type: string
    - in: query
      name: orderBy
      description: Kolom pengurutan
      schema:
        type: string
    - in: query
      name: sortBy
      description: Arah pengurutan
      schema:
        type: string
        enum:
          - asc
          - desc
    - in: query
      name: offset
      schema:
        type: integer
    - in: query
      name: limit
      schema:
        type: integer
  responses:
    '200':
      description: Semua data kontak dalam format JSON

post:
  tags: [Kontak]
  summary: Menambahkan kontak
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            nmKontak:
              type: string
            idGrup:
              type: integer
            createdAt:
              type: string
          example:
            nmKontak: John Doe
            idGrup: 1
            createdAt: '2026-09-14 09:00:00'
  responses:
    '201':
      description: Created