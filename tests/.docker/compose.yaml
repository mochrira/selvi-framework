name: selvi_test
services:
  http:
    image: mochrira/dev:8.4-fpm-alpine3.21
    container_name: selvi_test_dev
    volumes:
      - ../../:/workspace
      - ./vhost.conf:/etc/apache2/conf.d/vhost.conf
    networks:
      - environment
      - database
    ports:
      - 8089:80

networks:
  environment:
    external: true
  database:
    external: true