name: selvi_test
services:
  http:
    image: mochrira/dev:8.3-fpm-alpine3.21
    container_name: selvi_php83_test_dev
    volumes:
      - ../../../:/workspace
      - ./vhost.conf:/etc/apache2/conf.d/vhost.conf
    networks:
      - environment
      - database

networks:
  environment:
    external: true
  database:
    external: true